<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
    <link rel="stylesheet" href="table.css">
</head>
<body>
     <h1>Colspan table :</h1>
    <table border="1" cellspacing="0">
        <colgroup>
            <col style="background-color: rgba(126, 203, 120, 0.634);">
            <col  style="background-color: aquamarine;">
            <col  style="background-color: rgba(255, 0, 0, 0.227);">
            <col style="background-color: rgba(10, 75, 5, 0.762);">

    
        <tr>
            <th>SN</th>
            <th colspan="2">full name</th>
            <th>marks</th>
        </tr>
        <tr>
            <td>1</td>
            <td>hem</td>
            <td>sah</td>
            <td>90</td>
            
        </tr>
         <tr>
            <td>2</td>
            <td>adi</td>
            <td>pandey</td>
            <td>90</td>
            
        </tr>
         <tr>
            <td>3</td>
            <td>anup</td>
            <td>pandey</td>
            <td>90</td>
            
        </tr>
         <tr>
            <td>4</td>
            <td>bimars</td>
            <td>khadka</td>
            <td>90</td>
            
        </tr>

        </colgroup>

    </table>
    <br><br>
    <h1>Rowspan table:</h1>

    <table border="1"  cellspacing="0">
        <tr>
            <th>Sn</th>
            <td>1</td>

            <td>2</td>
            <td>3</td>
        </tr>
         <tr>
            <th rowspan="2">full name</th>
            <td>hem</td>

            <td>adi</td>
            <td>bim</td>
        </tr>
         <tr>
            
            <td>sah</td>

            <td>pandey</td>
            <td>khadka</td>
        </tr>
         <tr>
            <th>marks</th>
            <td>90</td>

            <td>80</td>
            <td>60</td>
        </tr>
    </table>
    
</body>
</html>
